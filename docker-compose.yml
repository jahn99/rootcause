services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://rootcause:rootcause@db:5432/rootcause
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rootcause
      POSTGRES_USER: rootcause
      POSTGRES_PASSWORD: rootcause
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rootcause -d rootcause"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
